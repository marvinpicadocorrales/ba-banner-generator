<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=300,height=250">
<title>BA Banner – 300×250</title>

<!-- ── Shared styles: fonts, animations, base layout ── -->
<link rel="stylesheet" href="../../../Assets/css/shared.css">

<!-- ── Shared logic: clickTag + 30s animation stop ── -->
<script src="../../../Assets/js/shared.js"></script>

<style>
@font-face { font-family: 'Aeonik'; font-weight: 400; font-style: normal; src: url('fonts/Aeonik-Regular.otf') format('opentype'); }
@font-face { font-family: 'Aeonik'; font-weight: 700; font-style: normal; src: url('fonts/Aeonik-Bold.otf') format('opentype'); }

/* ============================================================
   300×250 — Two-column layout
   Left column: video  |  Right column: copy + CTA
   ============================================================ */

.banner {
  width: 300px;
  height: 250px;
  padding: 0;
  /* override shared flex defaults — layout handled by .layout-250 */
  display: block;
}

/* ── Video: full-bleed background (fallback = banner background #0d000f) ── */
/* .video-bg and .video-bg video styles come from shared.css */

/* ── Full content overlay ── */
.layout-250 {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  padding: 16px 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-sizing: border-box;
}

/* Logo row: full width */
.logo-container {
  height: 34px;
  width: 100%;
  overflow: hidden;
  flex-shrink: 0;
  animation: enter-up 0.5s ease both 0s;
}
.logo { width: 132px; height: 28px; display: block; }

/* Mid row: left spacer + right content */
.mid-row {
  display: flex;
  flex: 1;
  min-height: 0;
  gap: 0;
}
.col-space { flex: 1; }
.col-right {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  animation: enter-up 0.5s ease both 0.2s;
}

/* Copy container — override shared (no enter-up; col-right handles it) */
.copy-container {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  position: relative;
  animation: none;   /* suppressed — col-right animates instead */
}
.copy {
  position: absolute;
  left: 0;
  right: 0;
  text-align: left;
  text-shadow: 0px 6.836px 51.1px rgba(9, 1, 14, 0.9);
}
.copy-gold,
.copy-white { font-size: 17px; line-height: 1.2; }

/* ── Copy 2: "Up To" offer frame ── */
.copy-2 {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  text-align: left;
}
.copy-2 p .copy-gold,
.copy-2 p .copy-white   { font-size: 15px; line-height: 0.95; }
.upto-row {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 3px;
}
.copy-upto-label {
  font-size: 18px;
  line-height: 0.95;
  text-transform: uppercase;
  letter-spacing: 0.44px;
  width: 30px;
  flex-shrink: 0;
}
.copy-upto-amount {
  font-size: 36px;
  line-height: 1;
  white-space: nowrap;
}

/* Bottom: CTA + T&Cs — override shared width/animation */
.bottom {
  width: 100%;
  flex-shrink: 0;
  animation: none;  /* suppressed — col-right animates instead */
  gap: 4px;
}
.cta   { height: 32px; }
.cta-label { font-size: 13px; letter-spacing: 0.52px; }
</style>
</head>

<div class="banner">

  <!-- CLICK OVERLAY: full-banner clickable area (IAB / Google required) -->
  <a class="click-overlay"
     href="javascript:void(0)"
     onclick="window.open(clickTag)"
     aria-label="Learn more"></a>

  <!-- VIDEO: full-bleed background (fallback = banner background #0d000f) -->
  <div class="video-bg">
    <video autoplay muted loop playsinline>
      <source src="video/300x250.mp4" type="video/mp4">
    </video>
  </div>
