<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=300,height=50">
<title>BA Banner – 300×50</title>

<!-- ── Shared styles: fonts, animations, base layout ── -->
<link rel="stylesheet" href="../../../Assets/css/shared.css">

<!-- ── Shared logic: clickTag + 30s animation stop ── -->
<script src="../../../Assets/js/shared.js"></script>

<style>
@font-face { font-family: 'Aeonik'; font-weight: 400; font-style: normal; src: url('fonts/Aeonik-Regular.otf') format('opentype'); }
@font-face { font-family: 'Aeonik'; font-weight: 700; font-style: normal; src: url('fonts/Aeonik-Bold.otf') format('opentype'); }

/* ── Size-specific overrides for 300×50 ── */

/* Reset banner to horizontal layout */
.banner {
  width: 300px;
  height: 50px;
  background: #1b0428;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  padding: 4px 8px;
  gap: 0;
}

/* Left: copy column — flex row: [T&Cs rotated | copy stack] */
.copy-col {
  flex: 1;
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 4px;
}

/* T&Cs rotated -90deg on the left edge */
.tcs-col {
  width: 11px;
  flex-shrink: 0;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.tcs-rotated {
  transform: rotate(-90deg);
  white-space: nowrap;
  font-family: 'Aeonik', Arial, sans-serif;
  font-weight: 400;
  font-size: 6px;
  color: #f4f4f4;
  opacity: 0.5;
}

/* Inner copy stack — position:relative so copy-sm blocks stack */
.copy-inner {
  flex: 1;
  min-width: 0;
  height: 100%;
  position: relative;
}

/* Each copy block fills the inner stack and centres vertically */
.copy-sm {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
}

.copy-sm p {
  text-shadow: 0px 6.836px 51.1px rgba(9, 1, 14, 0.9);
}

/* Override shared copy-gold / copy-white sizes */
.copy-gold,
.copy-white { font-size: 14px; line-height: 1.2; }

/* Right: logo + CTA column */
.logo-col {
  width: 80px;
  flex-shrink: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  position: relative;
  z-index: 1;
}

.logo-sm {
  width: 70px;
  height: 15px;
  display: block;
  flex-shrink: 0;
}

/* XS CTA: override shared .cta height + label size */
.cta { width: 100%; height: 20px; }
.cta-label { font-size: 8px; letter-spacing: 0.32px; }

/* Entrance animations: logo → CTA (staggered) */
.logo-sm { animation: enter-up 0.5s ease both 0s; }
.cta      { animation: enter-up 0.5s ease both 0.2s, glow 2s ease-in-out infinite 1.0s; }
</style>
</head>

<div class="banner">

  <!-- CLICK OVERLAY: full-banner clickable area (IAB / Google required) -->
  <a class="click-overlay"
     href="javascript:void(0)"
     onclick="window.open(clickTag)"
     aria-label="Learn more"></a>

  <!-- LEFT: T&Cs (rotated) + copy -->
  <div class="copy-col">
    <div class="tcs-col">
      <p class="tcs-rotated">T&amp;Cs Apply</p>
    </div>
    <div class="copy-inner">
      <!-- Copy 1 -->
      <div class="copy-sm copy-1">
        <p class="copy-gold">Every spin. Every moment.</p>
        <p class="copy-white">Pure adrenaline.</p>
      </div>
      <!-- Copy 2 -->
      <div class="copy-sm copy-2">
        <p class="copy-gold">Golden text</p>
        <p class="copy-white">White text</p>
      </div>
    </div>
  </div>
